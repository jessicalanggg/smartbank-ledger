services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: smartbank
      POSTGRES_USER: smartbank
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local_dev_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbank -d smartbank"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: ../backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/smartbank
      # Migrations run as the owner; the app connects as smartbank_app (see V17).
      DB_USER: smartbank
      DB_PASSWORD: ${DB_PASSWORD:-local_dev_only}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-local_dev_app_only}
      JWT_SECRET: ${JWT_SECRET:-local_only_jwt_signing_key_change_before_any_deployment_2026}
      WEBHOOK_ENCRYPTION_KEY: ${WEBHOOK_ENCRYPTION_KEY:-local_only_webhook_encryption_key_change_before_deploying_2026}
      # Local development only: lets webhooks reach a receiver on your machine.
      WEBHOOK_ALLOW_HTTP: ${WEBHOOK_ALLOW_HTTP:-true}
      WEBHOOK_ALLOW_PRIVATE_TARGETS: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-LocalDemoPass123!}
      # Local-only Ed25519 key pair for signing ledger seals; generate your own for anything else.
      SEAL_SIGNING_PRIVATE_KEY: ${SEAL_SIGNING_PRIVATE_KEY:-MC4CAQAwBQYDK2VwBCIEIKVrMfDvqKhG9ApR3zc5SJCsvcnh1TNVmK8IWjiRXJWt}
      SEAL_SIGNING_PUBLIC_KEY: ${SEAL_SIGNING_PUBLIC_KEY:-MCowBQYDK2VwAyEAZfItwPtQF5mv0N+QGzlgRcHWyHaD2CHkpFJVZA2mA4U=}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
