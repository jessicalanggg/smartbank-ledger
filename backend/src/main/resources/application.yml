spring:
  application:
    name: smartbank
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartbank}
    # The app runs as smartbank_app, which can add to the ledger but not rewrite it (V17).
    username: ${DB_APP_USER:smartbank_app}
    password: ${DB_APP_PASSWORD:local_dev_app_only}
    hikari:
      # No database transaction may stay open longer than this. Balance checkpoints rely on
      # it: once a moment is further back than the checkpoint horizon, nothing can still
      # commit an entry dated before it.
      connection-init-sql: SET transaction_timeout = '2min'

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Send same-shaped statements from one flush (e.g. two account updates) in one round trip.
      hibernate.jdbc.batch_size: 25
      hibernate.order_updates: true
      hibernate.order_inserts: true
  flyway:
    enabled: true
    # Migrations run as the schema owner.
    user: ${DB_USER:smartbank}
    password: ${DB_PASSWORD:local_dev_only}
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 8080

smartbank:
  db:
    # Set on the smartbank_app role after each migration; leave empty if an administrator manages the role.
    app-password: ${DB_APP_PASSWORD:local_dev_app_only}
  jwt-secret: ${JWT_SECRET}
  demo-password: ${DEMO_PASSWORD:}
  rate-limits:
    enabled: true
    login-per-email: { capacity: 5, refill-every: 3m }
    auth-per-ip: { capacity: 20, refill-every: 3s }
    register-per-ip: { capacity: 5, refill-every: 12m }
    anonymous-per-ip: { capacity: 60, refill-every: 1s }
    api-per-user: { capacity: 100, refill-every: 20ms }
    writes-per-user: { capacity: 20, refill-every: 100ms }
  webhooks:
    # Encrypts webhook signing secrets at rest. At least 32 characters; keep it out of the database.
    encryption-key: ${WEBHOOK_ENCRYPTION_KEY}
    # Production should keep both false: https only, and no internal or private targets (SSRF).
    allow-http: ${WEBHOOK_ALLOW_HTTP:false}
    allow-private-targets: ${WEBHOOK_ALLOW_PRIVATE_TARGETS:false}
  ledger:
    seal-interval: PT5S
    # Ed25519 keys (base64 DER) that sign every seal; the private key must never be in the database.
    # Without them seals are only hash-chained, and a warning is logged at startup.
    seal-signing:
      private-key: ${SEAL_SIGNING_PRIVATE_KEY:}
      public-key: ${SEAL_SIGNING_PUBLIC_KEY:}
      previous-public-keys: ${SEAL_SIGNING_PREVIOUS_PUBLIC_KEYS:}
    # Balance checkpoints: one per period boundary (UTC), taken once the boundary is
    # older than the horizon. The horizon must be well above transaction_timeout.
    checkpoint-period: P1D
    checkpoint-horizon: PT10M
    checkpoint-interval: PT15M
