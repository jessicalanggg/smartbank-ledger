spring:
  application:
    name: smartbank
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartbank}
    username: ${DB_USER:smartbank}
    password: ${DB_PASSWORD:local_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Send same-shaped statements from one flush (e.g. two account updates) in one round trip.
      hibernate.jdbc.batch_size: 25
      hibernate.order_updates: true
      hibernate.order_inserts: true
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 8080

smartbank:
  jwt-secret: ${JWT_SECRET}
  demo-password: ${DEMO_PASSWORD:}
  rate-limits:
    enabled: true
    login-per-email: { capacity: 5, refill-every: 3m }
    auth-per-ip: { capacity: 20, refill-every: 3s }
    register-per-ip: { capacity: 5, refill-every: 12m }
    anonymous-per-ip: { capacity: 60, refill-every: 1s }
    api-per-user: { capacity: 100, refill-every: 20ms }
    writes-per-user: { capacity: 20, refill-every: 100ms }
