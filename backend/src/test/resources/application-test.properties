smartbank.jwt-secret=SmartBankIntegrationTestSecretKey2026OnlyDoNotUseInProduction123456
# Tests send bursts of requests through the API; the rate-limit tests set their own small limits.
smartbank.rate-limits.login-per-email.capacity=100000
smartbank.rate-limits.auth-per-ip.capacity=100000
smartbank.rate-limits.register-per-ip.capacity=100000
smartbank.rate-limits.anonymous-per-ip.capacity=100000
smartbank.rate-limits.api-per-user.capacity=100000
smartbank.rate-limits.writes-per-user.capacity=100000
smartbank.webhooks.encryption-key=WebhookTestEncryptionKeyForIntegrationTestsOnly2026
# Tests connect as the container's owner (so they can set up data directly); Flyway too.
# AppRoleTest runs the app as the restricted smartbank_app role instead.
spring.flyway.user=test
spring.flyway.password=test
